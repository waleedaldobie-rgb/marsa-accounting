services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marsa}
      POSTGRES_USER: ${POSTGRES_USER:-marsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marsa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marsa} -d ${POSTGRES_DB:-marsa}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
