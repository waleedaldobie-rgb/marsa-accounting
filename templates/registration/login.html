{% extends 'base.html' %}
{% block title %}تسجيل الدخول — مَرسى{% endblock %}
{% block unauthenticated %}
<div class="login-page"><div class="login-card"><div class="brand centered"><div class="brand-mark">م</div><div><strong>مَرسى</strong><small>إدارة محلات الأسماك</small></div></div><h1>تسجيل الدخول</h1><p class="muted">ادخل إلى نظام التشغيل والإدارة.</p>{% if form.errors %}<div class="alert error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>{% endif %}<form method="post">{% csrf_token %}<label>اسم المستخدم<input type="text" name="username" autofocus autocomplete="username" required></label><label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required></label><button class="primary-button full" type="submit">دخول النظام</button></form></div></div>
{% endblock %}
